version: 2

sphinx:
  builder: html
  configuration: source/conf.py
  fail_on_warning: false

python:
  install:
    - method: uv
      command: sync

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - librsvg2-bin
  jobs:
    build:
      htmlzip:
        - mkdir --parents _readthedocs/htmlzip
        - uv run sphinx-build -T -W --keep-going -b readthedocssinglehtmllocalmedia -d _build/doctrees -D language=$READTHEDOCS_LANGUAGE source $READTHEDOCS_OUTPUT/$READTHEDOCS_PROJECT
        - cd $READTHEDOCS_OUTPUT ; zip --recurse-path --symlinks htmlzip/$READTHEDOCS_PROJECT.zip $READTHEDOCS_PROJECT

formats:
  - htmlzip
  - pdf
